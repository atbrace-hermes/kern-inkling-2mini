# Optimization workload for Inkling-2-Mini (text-only + DSpark MTP, SM120).
#
# Adapted from one full day of public agent-service traces recorded by kern-serve
# (deploy/traces/20261120T053526Z, 2026-11-20, 36 rank-0 files, 394,719 steps,
# 29,661.0 s traced GPU step time; top buckets covering 99.7% of step time):
#
#   1. Speculative rounds: Qwen3.8 DSpine 16-row rounds -> Inkling-2-Mini DSpark
#      8-row rounds (`rows = [8]`), keeping the traced call counts per bucket
#      (20 buckets across groups 1, 2, 4, 8; 348,447 steps = 99.90% of rounds).
#      The 73-step groups=16 tail (0.02%) is omitted to match `seqs <= 8`.
#   2. Full prefill chunks: Inkling-2-Mini serves with `--chunk 2048` (manifest
#      `tokens <= 2048`), so the 9 full `chunk = 1024` buckets (44,452 steps,
#      45.52M tokens) are repacked into 8 `chunk = 2048` buckets (22,228 steps,
#      45.52M tokens — preserving total prefill tokens and context distribution).
#   3. Partial prefill chunks: kept the top 4 mid-size tails (`512, 385, 200`)
#      plus the top short tail (`chunk = 51`) so every manifest `when` branch is
#      exercised (`moe_route_metadata` <=1024 / >=1025, `moe_*_gemm` <=32 / >=33,
#      `attn_full_prefill` <=64 / >=65, `attn_*_decode` seqs=1 / >=2) as well as
#      both sides of the SWA window (`W = 1024`).
#
# Plan footprint: 33 scenarios, 0 dropped, 762,176 KV tokens (13.08 GiB FP8 KV)
# and 9 seq slots (~0.8 GiB SWA/sconv state) — fits comfortably on 72 GB VRAM,
# including multi-candidate `kern bench --candidate` runs.
