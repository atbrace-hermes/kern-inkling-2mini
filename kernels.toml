# Declarative SM120 AOT CUDA kernel build specification for scripts/build.py.
# (Runtime module pinning lives in out/inkling-2-mini/model.json & kern.toml; `kern` CLI does not read this file.)

[toolchain]
nvcc = "13.5.37"
arch = "sm_120a"
triton = "3.8.0"
triton_arch = 120
triton_warp_size = 32

[upstreams.flashinfer]
path = "third_party/flashinfer"
revision = "023a8474e1f7469572c0d4284535fc6ffa699574"
license = "Apache-2.0"

[upstreams.cutlass]
path = "third_party/flashinfer/3rdparty/cutlass"
license = "BSD-3-Clause"

[flags]
plain = ["-std=c++17", "--expt-relaxed-constexpr", "-O3", "-lineinfo"]
strict_fp32 = ["-std=c++17", "--expt-relaxed-constexpr", "-O3", "-lineinfo", "--fmad=false"]
cutlass_sm120 = ["-std=c++20", "--expt-relaxed-constexpr", "-O3", "-lineinfo", "-DCUTLASS_ARCH_MMA_SM120_SUPPORTED=1", "-diag-suppress", "20012,177"]

[includes]
flashinfer = ["third_party/flashinfer/include"]
cutlass = ["third_party/flashinfer/3rdparty/cutlass/include", "third_party/flashinfer/include"]

