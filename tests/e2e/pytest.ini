[pytest]
testpaths = .
markers =
    tier1: Tier 1 functional feature verification tests (live server / GPU)
    tier2: Tier 2 boundary, corner, and negative tests (live server / GPU)
    tier3: Tier 3 pairwise cross-feature combination tests (live server / GPU)
    tier4: Tier 4 real-world application, stress, and benchmark workloads (live server / GPU)
    selftest: CPU-only test suite self-tests using an in-process mock server (no GPU)
    gpu: Tests requiring a live kern-serve GPU server or kern GPU CLI
    cli: Tests invoking kern CLI GPU/manifest binaries (kern verify, kern run, kern test e2e-logits)
    hybrid: Tests requiring both live kern-serve HTTP and kern CLI (serve-vs-kern-run parity)
